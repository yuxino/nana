<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="输入推特用户名，在头像墙里快速找到自己。"
    />
    <title>nana · 艾薇娜的头像墙</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        nana<i class="brand-dot" aria-hidden="true"></i
        ><span>艾薇娜的头像墙</span>
      </div>
    </header>
    <main>
      <aside>
        <div class="hello-cat">
          <img
            src="assets/avina-chibi.png"
            alt="无能的艾薇娜的 Q 版形象"
            width="112"
            height="112"
          /><span>你在这里呀</span>
        </div>
        <h1>人海里，<br />找到小小的你。</h1>
        <section id="targetSlot">
          <label class="field-label" for="targetUrl">你的推特用户名</label>
          <div class="search-box">
            <input
              id="targetUrl"
              aria-label="用户名、主页链接或头像图片地址"
              placeholder="输入用户名，例如 vvnuds"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
            /><button id="targetUrlLoad" type="button">
              找头像<svg
                viewBox="0 0 20 20"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="M4 10h12m-5-5 5 5-5 5" />
              </svg>
            </button>
          </div>
          <div class="identity">
            <img class="preview hidden" id="preview" alt="要查找的头像" />
            <div class="identity-copy">
              <strong id="targetName">等待输入用户名</strong>
            </div>
          </div>
        </section>
        <div class="result-head">
          <h2>是不是这个你？</h2>
          <span class="meta" id="count">等待匹配</span>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">
          正在准备默认头像墙…
        </p>
        <div id="candidates" class="candidates"></div>
        <details class="source-settings" id="wallSlot" open>
          <summary>更新头像墙<span id="gridInfo">识别中</span></summary>
          <p id="wallName">默认头像墙</p>
          <label class="field-label" for="wallUrl">大图图片地址</label>
          <div class="urlrow">
            <textarea
              id="wallUrl"
              aria-label="大图图片地址"
              placeholder="粘贴大图图片地址"
              rows="3"
              spellcheck="false"
              wrap="soft"
            ></textarea
            ><button id="wallUrlLoad" type="button">读取大图</button>
          </div>
          <button class="demo" id="demo">恢复默认图片</button>
        </details>
        <div class="privacy">
          <span id="avatarSource">头像来自 FxTwitter</span>
        </div>
      </aside>
      <section class="wall-panel" aria-label="头像墙">
        <div class="toolbar">
          <div class="wall-heading">
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              aria-hidden="true"
            >
              <rect x="2.5" y="2.5" width="5" height="5" rx="1" />
              <rect x="12.5" y="2.5" width="5" height="5" rx="1" />
              <rect x="2.5" y="12.5" width="5" height="5" rx="1" />
              <rect x="12.5" y="12.5" width="5" height="5" rx="1" /></svg
            ><strong id="location">完整头像墙</strong>
          </div>
          <div class="tools">
            <label for="zoom" class="meta">缩放</label
            ><input
              id="zoom"
              type="range"
              min="100"
              max="400"
              step="25"
              value="100"
            /><button id="fit" type="button">看全图</button>
          </div>
        </div>
        <div id="viewport">
          <div id="stage">
            <img id="wall" alt="粉丝头像墙" src="assets/wall.jpg" />
            <div id="marker" class="hidden"></div>
          </div>
        </div>
        <div id="locatorTip" class="hidden" aria-hidden="true"></div>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
